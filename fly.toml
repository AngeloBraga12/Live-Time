# Troque `app` por um nome único (fly launch --no-deploy --copy-config).
app = "live-time"
primary_region = "gru"

[build]

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  # A API precisa ficar ligada o tempo todo para manter a conexão com o feed da F1.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
